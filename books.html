<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Library & Archives - Note Hub Official</title>
    <meta name="description" content="Access over 20 million free books, technical documents, and research papers on Note Hub Official.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; text-align: center; }
        .search-input { width: 70%; padding: 14px 20px; font-size: 16px; border-radius: 30px; border: 2px solid #6366f1; background: #111827; color: #fff; outline: none; }
        .search-btn { padding: 14px 25px; border-radius: 30px; background: #6366f1; color: white; border: none; font-weight: bold; cursor: pointer; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; text-align: left; }
        .card { background: #1f2937; border: 1px solid #374151; padding: 20px; border-radius: 12px; color: white; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { font-size: 1.1rem; color: #818cf8; margin-bottom: 8px; }
        .card p { font-size: 0.85rem; color: #9ca3af; line-height: 1.4; }
        .btn-link { display: block; margin-top: 15px; padding: 10px; background: #10b981; color: white; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div>
            <a href="index.html"><span>Note Hub <span>Official</span></span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="books.html">Book Library</a>
                <a href="courses.html">Free Courses</a>
                <a href="videos.html">Video Tutorials</a>
                <a href="pdf-notes.html">PDF Notes</a>
                <a href="search.html">Search Engine</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2><i class="fa-solid fa-building-columns"></i> Global Library Archive</h2>
        <p>Direct live connection to 20+ Million Books, Research Papers, and Technical Guides.</p>
        <br>
        <input type="text" id="query" class="search-input" placeholder="Search any topic (e.g. Artificial Intelligence, Physics, Medical, Programming)...">
        <button onclick="fetchGlobalBooks()" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search Archive</button>

        <div id="status" style="display:none; margin-top:20px; color:#818cf8;"><i class="fa-solid fa-spinner fa-spin"></i> Connecting to Global Servers...</div>
        <div id="grid" class="results-grid"></div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('query').value = 'Computer Science';
            fetchGlobalBooks();
        };

        function fetchGlobalBooks() {
            const q = document.getElementById('query').value.trim();
            if (!q) return;

            const grid = document.getElementById('grid');
            const status = document.getElementById('status');
            grid.innerHTML = '';
            status.style.display = 'block';

            // Fetching from Internet Archive Global API
            fetch(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}+AND+mediatype:(texts)&fl[]=identifier,title,creator,description&sort[]=&rows=15&page=1&output=json`)
                .then(res => res.json())
                .then(data => {
                    status.style.display = 'none';
                    const docs = data.response.docs;

                    if (!docs || docs.length === 0) {
                        grid.innerHTML = '<p style="color:#9ca3af;">No archives found for this search query.</p>';
                        return;
                    }

                    docs.forEach(item => {
                        const title = item.title || 'Educational Document';
                        const author = item.creator ? (Array.isArray(item.creator) ? item.creator[0] : item.creator) : 'Global Author/Publisher';
                        const desc = item.description ? (Array.isArray(item.description) ? item.description[0] : item.description).substring(0, 100) + '...' : 'Complete technical book archive available for online read and study.';
                        const link = `https://archive.org/details/${item.identifier}`;

                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <div>
                                <h3>${title}</h3>
                                <p><strong>Author:</strong> ${author}</p>
                                <p style="margin-top:8px;">${desc}</p>
                            </div>
                            <a href="${link}" target="_blank" class="btn-link"><i class="fa-solid fa-book-open"></i> Read Full Book</a>
                        `;
                        grid.appendChild(div);
                    });
                })
                .catch(() => {
                    status.style.display = 'none';
                    grid.innerHTML = '<p style="color:#ef4444;">Server timeout. Please retry search.</p>';
                });
        }
    </script>
</body>
</html>
