<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Knowledge Engine - Note Hub Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .search-wrap { max-width: 800px; margin: 40px auto; padding: 20px; }
        .search-box { width: 100%; padding: 15px 25px; font-size: 18px; border-radius: 30px; border: 2px solid #6366f1; background: #111827; color: white; outline: none; }
        .result-card { background: #1f2937; padding: 20px; border-radius: 10px; margin-top: 15px; border-left: 4px solid #6366f1; }
        .result-card h3 a { color: #818cf8; text-decoration: none; font-size: 1.2rem; }
        .result-card p { color: #d1d5db; margin-top: 8px; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>

    <header>
        <div>
            <a href="index.html"><span>Note Hub <span>Official</span></span></a>
            <nav>
                <a href="index.html">Home</a>
                <a href="books.html">Book Library</a>
                <a href="courses.html">Free Courses</a>
                <a href="videos.html">Video Tutorials</a>
                <a href="pdf-notes.html">PDF Notes</a>
                <a href="search.html">Search Engine</a>
            </nav>
        </div>
    </header>

    <div class="search-wrap">
        <h2><i class="fa-solid fa-globe"></i> Global Educational Search Engine</h2>
        <p>Search any subject, terminology, or concept across world archives.</p>
        <br>
        <input type="text" id="searchInput" class="search-box" placeholder="Type anything to search globally..." onkeyup="liveGlobalSearch()">
        
        <div id="searchResults" style="margin-top:20px;"></div>
    </div>

    <script>
        let timeout = null;
        function liveGlobalSearch() {
            clearTimeout(timeout);
            const query = document.getElementById('searchInput').value.trim();
            const results = document.getElementById('searchResults');
            
            if (query.length < 2) {
                results.innerHTML = '';
                return;
            }

            timeout = setTimeout(() => {
                // Live Wikipedia Global Search API
                fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&prop=info&inprop=url&utf8=&format=json&origin=*&srlimit=10&srsearch=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        results.innerHTML = '';
                        const items = data.query.search;

                        if (items.length === 0) {
                            results.innerHTML = '<p style="color:#aaa;">No global results found.</p>';
                            return;
                        }

                        items.forEach(item => {
                            const title = item.title;
                            const snippet = item.snippet + '...';
                            const url = `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`;

                            const div = document.createElement('div');
                            div.className = 'result-card';
                            div.innerHTML = `
                                <h3><a href="${url}" target="_blank">${title}</a></h3>
                                <p>${snippet}</p>
                            `;
                            results.appendChild(div);
                        });
                    });
            }, 300);
        }
    </script>
</body>
</html>
